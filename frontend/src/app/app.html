<header class="kopf">
    <span class="titel">Bärenhöhle</span>


    <nav class="menue" aria-label="Hauptmenü">
        @for (punkt of menue; track punkt.titel) {
            @if (punkt.kinder) {
                <div class="mit-sub" routerLinkActive="aktiv-eltern">
                    <button type="button" class="punkt" aria-haspopup="true">{{ punkt.titel }}</button>
                    <div class="sub">
                        @for(kind of punkt.kinder; track kind.titel) {
                            <a class="unterpunkt" [routerLink]="kind.pfad" routerLinkActive="aktiv">{{ kind.titel }}</a>
                        }
                    </div>
                </div>
            } @else if (punkt.pfad) {
                <a
                    class="punkt"
                    [routerLink]="punkt.pfad"
                    routerLinkActive="aktiv"
                    [routerLinkActiveOptions]="{ exact: true }"
                    >{{ punkt.titel }}</a
                >
            }@else {
                <span class="punkt bald" title="Kommt bald"> {{ punkt.titel }}</span>
            }
        }
    </nav>

    <button type="button" class="profil" aria-label="Profil">
        <span class="avatar">?</span>
    </button>
</header>

<main>
    <router-outlet />
</main>
