<div class="tag-umschalter">
    <div
        class="seg"
        role="group"
        aria-label="Tag wählen"
        [attr.data-tag]="tagOffset()"
        [class.nach-r]="richtung() === 'nach-r'"
        [class.nach-l]="richtung() === 'nach-l'"
    >
        <span class="thumb" aria-hidden="true"></span>
        <button type="button" [attr.aria-pressed]="tagOffset() === 0" (click)="tagWechseln(0)">Heute</button>
        <button type="button" [attr.aria-pressed]="tagOffset() === 1" (click)="tagWechseln(1)">Morgen</button>
    </div>
    <span class="tag-datum">{{ angezeigterTagText() }}</span>
</div>

<div class="personen-liste">
    @for(person of personService.personen.value(); track person.id) {
        <app-person-karte [person]="person" [tag]="angezeigterTag()" />
    }
</div>
